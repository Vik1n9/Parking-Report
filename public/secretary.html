<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>秘書彙整</title>
<style>
:root{
  --bg:#f3f7fb;--surface:#ffffff;--surface2:#e8eff7;--border:#172033;--text:#07111f;--sub:#172033;
  --accent:#005fcc;--green:#087a2e;--amber:#9a5200;--red:#b42318;--focus:#ffb000;
  --shadow:0 8px 20px rgba(7,17,31,.12);
  --sans:'Helvetica Neue','PingFang TC','Microsoft JhengHei',sans-serif;
  --mono:'SF Mono','Cascadia Code','Consolas',monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans)}
button{font:inherit;cursor:pointer}
.app{max-width:980px;margin:0 auto;padding:16px 16px 60px}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;
  background:var(--surface);border:2px solid var(--border);border-radius:10px;box-shadow:var(--shadow);margin-bottom:14px;
}
.title{font-size:1.1rem;font-weight:900;letter-spacing:.05em}
.title small{display:block;color:var(--sub);font-size:.68rem;font-weight:800;letter-spacing:.08em;margin-top:2px}
.controls{
  display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;padding:14px 16px;
  background:var(--surface);border:2px solid var(--border);border-radius:10px;box-shadow:var(--shadow);margin-bottom:14px;
}
.field{display:flex;flex-direction:column;gap:4px}
.field label{color:var(--sub);font-size:.68rem;font-weight:900;letter-spacing:.06em}
.field input{
  min-height:36px;border:2px solid var(--border);border-radius:7px;padding:4px 10px;
  font:inherit;font-size:.82rem;background:#ffffff;color:var(--text);
}
.action-btn{
  min-height:40px;border:2px solid var(--border);border-radius:8px;font-weight:900;padding:6px 16px;font-size:.84rem;
}
.action-btn.primary{background:var(--accent);color:#ffffff;border-color:var(--accent)}
.action-btn.excel{background:var(--green);color:#ffffff;border-color:var(--green)}
.action-btn:focus-visible,.field input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.banner{
  background:#fff0d4;border:2px solid var(--amber);color:#442400;border-radius:9px;padding:10px 14px;
  font-size:.78rem;font-weight:800;margin-bottom:14px;display:none;
}
.banner.show{display:block}
.card{background:var(--surface);border:2px solid var(--border);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.card-head{padding:11px 14px;border-bottom:2px solid var(--border)}
.label{color:var(--sub);font-size:.72rem;font-weight:900;letter-spacing:.08em}
.record-list{padding:10px;display:flex;flex-direction:column;gap:10px}
.record-item{border:2px solid var(--border);border-radius:9px;padding:10px 12px}
.record-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.record-time{font-family:var(--mono);font-size:.8rem;font-weight:900;color:var(--accent)}
.record-by{color:var(--sub);font-size:.66rem;font-weight:800}
.record-text{
  white-space:pre-wrap;font-size:.78rem;line-height:1.6;background:#e6f7eb;border-left:4px solid var(--green);
  padding:8px 10px;margin:0;border-radius:0 6px 6px 0;
}
.tower-badge{
  display:inline-block;border:2px solid var(--border);border-radius:999px;padding:2px 10px;
  font-size:.68rem;font-weight:900;background:var(--surface2);
}
.empty{color:var(--sub);text-align:center;padding:24px 0;font-size:.82rem}
.toast{
  position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(18px);opacity:0;pointer-events:none;
  background:#07111f;color:#fff;border-radius:999px;padding:10px 16px;font-size:.84rem;font-weight:900;
  box-shadow:var(--shadow);transition:opacity .16s ease,transform .16s ease;z-index:60;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="title">秘書彙整<small>查詢紀錄 · 匯出主管報表</small></div>
  </header>

  <div class="banner" id="authBanner">尚未透過 Cloudflare Access 登入。請重新整理頁面完成登入；若持續出現請聯絡管理員。</div>

  <div class="controls">
    <div class="field">
      <label for="fromDate">起日（營運日）</label>
      <input type="date" id="fromDate">
    </div>
    <div class="field">
      <label for="toDate">迄日（營運日）</label>
      <input type="date" id="toDate">
    </div>
    <button class="action-btn primary" id="loadBtn">載入預覽</button>
    <button class="action-btn excel" id="exportBtn">下載主管報表 Excel</button>
  </div>

  <section class="card">
    <div class="card-head"><span class="label">紀錄預覽</span></div>
    <div class="record-list" id="recordList"><div class="empty">選擇日期區間後按「載入預覽」</div></div>
  </section>
</main>

<div class="toast" id="toast">已載入</div>

<script type="module">
const $ = (id) => document.getElementById(id);
const fromDate = $('fromDate');
const toDate = $('toDate');
const loadBtn = $('loadBtn');
const exportBtn = $('exportBtn');
const recordList = $('recordList');
const authBanner = $('authBanner');
const toast = $('toast');

function todayTaipei() {
  return new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Taipei',
    year: 'numeric', month: '2-digit', day: '2-digit',
  }).format(new Date());
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function showToast(message) {
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.remove('show'), 1800);
}

async function loadPreview() {
  const from = fromDate.value;
  const to = toDate.value || from;
  if (!from) {
    showToast('請先選擇起日');
    return;
  }
  try {
    const response = await fetch(`/api/records?from=${from}&to=${to}`);
    const data = await response.json().catch(() => ({}));
    if (response.status === 401) {
      authBanner.classList.add('show');
      return;
    }
    if (!response.ok) {
      showToast(`載入失敗：${data.error || response.status}`);
      return;
    }
    authBanner.classList.remove('show');
    const records = data.records || [];
    if (!records.length) {
      recordList.innerHTML = '<div class="empty">此區間沒有紀錄</div>';
      return;
    }
    recordList.innerHTML = records.map((record) => `
      <div class="record-item">
        <div class="record-head">
          <span class="record-time">${escapeHtml(record.businessDate)} ${escapeHtml(record.reportTime)}</span>
          <span class="tower-badge">車塔 ${record.towerPct == null ? '—' : record.towerPct + '%'} · 填表人 ${escapeHtml(record.preparedBy)}</span>
        </div>
        <pre class="record-text">${escapeHtml(record.consoleReport)}</pre>
      </div>
    `).join('');
    showToast(`已載入 ${records.length} 筆`);
  } catch {
    showToast('載入失敗，請檢查網路');
  }
}

function download() {
  const from = fromDate.value;
  const to = toDate.value || from;
  if (!from) {
    showToast('請先選擇起日');
    return;
  }
  window.location.href = `/api/records/export?from=${from}&to=${to}`;
}

fromDate.value = todayTaipei();
toDate.value = todayTaipei();
loadBtn.addEventListener('click', loadPreview);
exportBtn.addEventListener('click', download);
</script>
</body>
</html>
