<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./css/office.css">
<title>中控</title>
</head>
<body>
<div id="chrome"></div>
<main class="app">
  <div class="queue" id="queueList"></div>
  <div class="log" id="recordList"></div>
</main>
<div class="sheet-backdrop" id="confirmSheet">
  <div class="sheet glass">
    <pre class="report" id="previewText"></pre>
    <div id="remarkRows"></div>
    <p class="board-target" id="boardTarget">顯示牌應設為：—</p>
    <div class="display-before" id="displayBeforeRow">
      <span>調整前顯示牌數字</span>
      <input type="number" inputmode="numeric" min="0" max="9999" step="1" id="displayBefore" autocomplete="off">
    </div>
    <p class="display-before-error" id="displayBeforeError" hidden></p>
    <div class="action-row" id="confirmActions">
      <button class="btn" id="cancelConfirmBtn" type="button">取消</button>
      <button class="btn-primary" id="doConfirmBtn" type="button">確認並複製</button>
    </div>
    <div class="action-row" id="doneActions" hidden>
      <button class="btn-primary" id="lineShareBtn" type="button">LINE 分享</button>
      <button class="btn" id="copyAgainBtn" type="button">再複製</button>
      <button class="btn" id="closeConfirmBtn" type="button">關閉</button>
    </div>
  </div>
</div>
<div class="sheet-backdrop" id="rejectSheet">
  <div class="sheet glass">
    <input type="text" id="rejectReason" maxlength="200">
    <div class="action-row">
      <button class="btn" id="cancelRejectBtn" type="button">取消</button>
      <button class="btn btn-danger" id="doRejectBtn" type="button">退回</button>
    </div>
  </div>
</div>
<div class="toast glass" id="toast"></div>
<script type="module">
import { formatValue, businessDate, buildReport, buildTowerUsage, formatTime } from './js/parking-core.js';
import { mountChrome } from './js/office-chrome.js';
import { loadMe, logout, apiFetch } from './js/session.js';
import { sameValue, parseCorrection, mergeCorrections } from './js/value-edit.js';

const POLL_MS = 8000;
const $ = (id) => document.getElementById(id);

let zones = [];
let towerTotal = 1600;
let pendingReportsCache = [];
let pendingConfirm = null;
let pendingRejectId = null;
let lastConsoleText = '';
let sheetOpen = false;
let sheetBusy = false;

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function showToast(message) {
  const toast = $('toast');
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.remove('show'), 1800);
}
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    showToast('已複製');
    return true;
  } catch {
    return false;
  }
}
function isRedirectError(err) {
  return err?.message === 'unauthorized' || err?.message === 'must-change-password';
}
function renderZones(values) {
  return zones.map((zone) => {
    const value = values?.[zone.code] ?? { kind: 'none' };
    return `<div class="zone-item"><span>${escapeHtml(zone.label)}</span><b>${escapeHtml(formatValue(value))}</b></div>`;
  }).join('');
}
function sentryFromReport(text) {
  return String(text || '').match(/^中控回報：\d\d:\d\d (.+)回報/)?.[1] || '';
}

async function loadQueue() {
  const data = await apiFetch('/api/reports?status=pending');
  pendingReportsCache = data.reports || [];
  const reports = pendingReportsCache;
  $('queueList').innerHTML = reports.map((report) => `
    <div class="queue-item">
      <div><b>${escapeHtml(formatTime(report.submittedAt))}</b> ${escapeHtml(report.deviceLabel || '')} ${report.reviewedBy ? '<span class="tag-fixed">隊長已複核</span>' : ''}</div>
      ${renderZones(report.values)}
      <div class="action-row">
        <button class="btn-primary" data-confirm="${report.id}" type="button">確認</button>
        <button class="btn btn-danger" data-reject="${report.id}" type="button">退回</button>
      </div>
    </div>
  `).join('');
}

async function loadRecords() {
  const today = businessDate(new Date());
  const data = await apiFetch(`/api/records?from=${today}&to=${today}`);
  const records = data.records || [];
  $('recordList').innerHTML = records.map((record) => {
    const bits = [`<b>${escapeHtml(record.reportTime)}</b>`];
    if (record.towerRemaining != null) bits.push(`剩餘 ${escapeHtml(record.towerRemaining)}`);
    if (record.towerPct != null) bits.push(record.towerPct + '%');
    const sentry = sentryFromReport(record.consoleReport);
    if (sentry) bits.push(escapeHtml(sentry));
    if (Object.keys(record.corrections || {}).length > 0) bits.push('<span class="tag-fixed">已修正</span>');
    if (Object.keys(record.captainCorrections || {}).length > 0) bits.push('<span class="tag-fixed">隊長修正</span>');
    return `
    <div class="log-item">
      <div>${bits.join(' ')}</div>
      <button class="btn" data-copy="${record.id}" type="button">複製</button>
      <pre class="report" hidden>${escapeHtml(record.consoleReport)}</pre>
    </div>
  `;
  }).join('');
}

function sheetState() {
  const base = {};
  for (const zone of zones) base[zone.code] = pendingConfirm.values?.[zone.code] ?? { kind: 'none' };
  const parsedValues = {};
  const rows = new Map();
  let invalid = false;

  $('remarkRows').querySelectorAll('.remark-row').forEach((row) => {
    const zone = zones.find((z) => z.code === row.dataset.row);
    if (!zone) return;
    const input = row.querySelector('[data-value]');
    const fixed = row.querySelector('.remark-fixed');
    const error = row.querySelector('.remark-error');
    row.classList.remove('is-invalid', 'is-changed');
    fixed.hidden = true;
    error.hidden = true;
    const text = input.value.trim();
    if (!text) return;
    const parsed = parseCorrection(text, zone);
    if (!parsed.ok) {
      invalid = true;
      row.classList.add('is-invalid');
      error.textContent = parsed.error;
      error.hidden = false;
      return;
    }
    parsedValues[zone.code] = parsed.value;
    rows.set(zone.code, { row, fixed });
  });

  const { merged, corrections } = mergeCorrections(base, parsedValues);
  for (const [code, { row, fixed }] of rows) {
    if (sameValue(parsedValues[code], base[code])) continue;
    row.classList.add('is-changed');
    fixed.textContent = `保全原值：${formatValue(base[code])}`;
    fixed.hidden = false;
  }

  const displayText = $('displayBefore').value.trim();
  let displayBefore = null;
  $('displayBeforeRow').classList.remove('is-invalid');
  $('displayBeforeError').hidden = true;
  if (displayText) {
    if (!/^\d+$/.test(displayText) || Number(displayText) > 9999) {
      invalid = true;
      $('displayBeforeRow').classList.add('is-invalid');
      $('displayBeforeError').textContent = '0–9999 整數';
      $('displayBeforeError').hidden = false;
    } else {
      displayBefore = Number(displayText);
    }
  }

  return { merged, corrections, displayBefore, invalid };
}

function updateSheet() {
  if (!pendingConfirm) return;
  const state = sheetState();
  lastConsoleText = buildReport(state.merged, zones, {
    style: 'console',
    time: new Date(pendingConfirm.submittedAt),
    deviceLabel: pendingConfirm.deviceLabel,
  });
  $('previewText').textContent = lastConsoleText;
  const usage = buildTowerUsage(state.merged, zones, { towerTotal });
  $('boardTarget').textContent = `顯示牌應設為：${usage.valid ? usage.remaining : '—'}`;
  $('doConfirmBtn').disabled = sheetBusy || state.invalid;
}

function openConfirm(report) {
  pendingConfirm = report;
  sheetOpen = true;
  sheetBusy = false;
  $('remarkRows').innerHTML = zones.map((zone) => {
    const guard = report.values?.[zone.code] ?? { kind: 'none' };
    const captain = report.reviewCorrections?.[zone.code];
    return `
    <div class="remark-row" data-row="${escapeHtml(zone.code)}">
      <span class="remark-zone">${escapeHtml(zone.label)}</span>
      <input class="remark-value" type="text" inputmode="text" autocomplete="off" data-value aria-label="${escapeHtml(zone.label)} 數值" placeholder="${escapeHtml(formatValue(guard))}">
      <input class="remark-note" type="text" maxlength="50" autocomplete="off" data-code="${escapeHtml(zone.code)}" aria-label="${escapeHtml(zone.label)} 備註" placeholder="備註">
      ${captain ? `<p class="remark-captain">車巡原值：${escapeHtml(formatValue(captain))}</p>` : ''}
      <p class="remark-fixed" hidden></p>
      <p class="remark-error" hidden></p>
    </div>
  `;
  }).join('');
  $('remarkRows').hidden = false;
  $('displayBeforeRow').hidden = false;
  $('displayBefore').value = '';
  $('displayBeforeRow').classList.remove('is-invalid');
  $('displayBeforeError').hidden = true;
  $('confirmActions').hidden = false;
  $('doneActions').hidden = true;
  $('confirmSheet').classList.add('show');
  updateSheet();
}

function closeConfirm() {
  $('confirmSheet').classList.remove('show');
  pendingConfirm = null;
  sheetOpen = false;
  sheetBusy = false;
}

async function doConfirm() {
  if (!pendingConfirm || sheetBusy) return;
  const state = sheetState();
  if (state.invalid) return;
  const remarks = {};
  $('remarkRows').querySelectorAll('input[data-code]').forEach((input) => {
    const value = input.value.trim();
    if (value) remarks[input.dataset.code] = value;
  });
  const body = { values: state.corrections, remarks };
  if (state.displayBefore !== null) body.display_before = state.displayBefore;
  sheetBusy = true;
  $('doConfirmBtn').disabled = true;
  try {
    const data = await apiFetch(`/api/reports/${pendingConfirm.id}/confirm`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body),
    });
    const record = data.record || {};
    lastConsoleText = record.consoleReport || lastConsoleText;
    $('previewText').textContent = lastConsoleText;
    $('remarkRows').hidden = true;
    $('displayBeforeRow').hidden = true;
    $('confirmActions').hidden = true;
    $('doneActions').hidden = false;
    $('boardTarget').textContent = `顯示牌應設為：${record.towerRemaining != null ? record.towerRemaining : '—'}`;
    await copyText(lastConsoleText);
    await refresh();
  } catch (err) {
    if (!isRedirectError(err)) showToast(err.message);
  } finally {
    sheetBusy = false;
    if (pendingConfirm) $('doConfirmBtn').disabled = sheetState().invalid;
  }
}

function openReject(id) {
  pendingRejectId = id;
  sheetOpen = true;
  $('rejectReason').value = '';
  $('rejectSheet').classList.add('show');
}
function closeReject() {
  $('rejectSheet').classList.remove('show');
  pendingRejectId = null;
  sheetOpen = false;
}
async function doReject() {
  if (!pendingRejectId) return;
  $('doRejectBtn').disabled = true;
  try {
    await apiFetch(`/api/reports/${pendingRejectId}/reject`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ reason: $('rejectReason').value.slice(0, 200) }),
    });
    closeReject();
    await refresh();
  } catch (err) {
    if (!isRedirectError(err)) showToast(err.message);
  } finally {
    $('doRejectBtn').disabled = false;
  }
}

async function refresh() {
  try {
    await Promise.all([loadQueue(), loadRecords()]);
  } catch {}
}

$('queueList').addEventListener('click', (event) => {
  const confirmId = event.target.closest('[data-confirm]')?.dataset.confirm;
  const rejectId = event.target.closest('[data-reject]')?.dataset.reject;
  if (confirmId) {
    const report = pendingReportsCache.find((r) => r.id === Number(confirmId));
    if (report) openConfirm(report);
  } else if (rejectId) {
    openReject(Number(rejectId));
  }
});
$('recordList').addEventListener('click', async (event) => {
  const btn = event.target.closest('[data-copy]');
  if (!btn) return;
  const text = btn.parentElement.querySelector('.report')?.textContent || '';
  await copyText(text);
});
$('cancelConfirmBtn').addEventListener('click', closeConfirm);
$('closeConfirmBtn').addEventListener('click', closeConfirm);
$('doConfirmBtn').addEventListener('click', doConfirm);
$('remarkRows').addEventListener('input', updateSheet);
$('displayBefore').addEventListener('input', updateSheet);
$('copyAgainBtn').addEventListener('click', () => copyText(lastConsoleText));
$('lineShareBtn').addEventListener('click', () => {
  const url = `https://line.me/R/share?text=${encodeURIComponent(lastConsoleText)}`;
  window.open(url, '_blank', 'noopener');
  copyText(lastConsoleText);
});
$('cancelRejectBtn').addEventListener('click', closeReject);
$('doRejectBtn').addEventListener('click', doReject);
$('confirmSheet').addEventListener('click', (event) => {
  if (event.target === $('confirmSheet')) closeConfirm();
});
$('rejectSheet').addEventListener('click', (event) => {
  if (event.target === $('rejectSheet')) closeReject();
});

async function start() {
  try {
    const data = await apiFetch('/api/zones');
    zones = data.zones || [];
    towerTotal = Number.isFinite(data.towerTotal) ? data.towerTotal : 1600;
  } catch {
    zones = [];
  }
  await refresh();
}

const me = await loadMe();
if (me) {
  mountChrome($('chrome'), { current: 'console', date: businessDate(new Date()), me });
  document.querySelector('[data-logout]')?.addEventListener('click', logout);
  await start();
}
setInterval(() => {
  if (!sheetOpen) refresh();
}, POLL_MS);
</script>
</body>
</html>
