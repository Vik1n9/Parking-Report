<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="data:,">
<title>保全停車回報</title>
<style>
:root{
  --bg:#f3f7fb;
  --surface:#ffffff;
  --surface2:#e8eff7;
  --surface3:#d8e4ef;
  --border:#172033;
  --text:#07111f;
  --sub:#172033;
  --accent:#005fcc;
  --green:#087a2e;
  --amber:#9a5200;
  --red:#b42318;
  --focus:#ffb000;
  --key-bg:#ffffff;
  --key-ink:#07111f;
  --shadow:0 8px 20px rgba(7,17,31,.12);
  --sans:'Helvetica Neue','PingFang TC','Microsoft JhengHei',sans-serif;
  --calc:'Avenir Next','Arial Rounded MT Bold','Helvetica Neue','PingFang TC','Microsoft JhengHei',sans-serif;
  --mono:'SF Mono','Cascadia Code','Consolas',monospace;
}
*{box-sizing:border-box}
html{overflow-x:hidden;background:var(--bg)}
body{
  margin:0;
  min-height:100vh;
  overflow-x:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  -webkit-text-size-adjust:100%;
}
button{
  font:inherit;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
.app{
  width:100%;
  max-width:440px;
  min-height:100vh;
  margin:0 auto;
  padding:12px 12px 130px;
}
.topbar{
  position:sticky;
  top:0;
  z-index:10;
  margin:-12px -12px 12px;
  padding:12px;
  background:var(--bg);
  border-bottom:2px solid var(--border);
}
.topline{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.title{
  font-size:1rem;
  font-weight:900;
  letter-spacing:.05em;
}
.timebox{
  display:flex;
  align-items:center;
  gap:8px;
}
.clock{
  font-family:var(--mono);
  font-size:1.08rem;
  font-weight:900;
  letter-spacing:.08em;
}
.mini-btn{
  min-height:34px;
  border:2px solid var(--border);
  border-radius:7px;
  background:var(--surface);
  color:var(--text);
  padding:6px 10px;
  font-size:.72rem;
  font-weight:800;
}
.progress{
  margin-top:10px;
  display:flex;
  align-items:center;
  gap:8px;
}
.progress-label{
  min-width:42px;
  color:var(--sub);
  font-size:.78rem;
  font-weight:800;
}
.progress-track{
  flex:1;
  height:9px;
  border-radius:999px;
  background:var(--surface2);
  border:1px solid var(--border);
  overflow:hidden;
}
.progress-fill{
  height:100%;
  width:10%;
  border-radius:999px;
  background:var(--accent);
  transition:width .18s ease;
}
.sync-row{
  margin-top:8px;
  display:flex;
  align-items:center;
  gap:8px;
}
.sync-chip{
  display:inline-flex;
  align-items:center;
  min-height:22px;
  border:2px solid var(--border);
  border-radius:999px;
  background:var(--surface2);
  color:var(--sub);
  padding:2px 10px;
  font-size:.62rem;
  font-weight:900;
  letter-spacing:.04em;
  white-space:nowrap;
}
.sync-chip.warn{background:#fff0d4;border-color:var(--amber);color:#442400}
.sync-chip.bad{background:#ffe5e1;border-color:var(--red);color:#5a0c07}
.sync-chip.good{background:#e6f7eb;border-color:var(--green);color:var(--text)}
.card{
  background:var(--surface);
  border:2px solid var(--border);
  border-radius:10px;
  box-shadow:var(--shadow);
  overflow:hidden;
  margin-bottom:12px;
}
.card-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:11px 13px;
  border-bottom:2px solid var(--border);
}
.label{
  color:var(--sub);
  font-size:.72rem;
  font-weight:900;
  letter-spacing:.08em;
}
.zones{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  padding:12px;
}
.zone-chip{
  min-height:64px;
  border:2px solid var(--border);
  border-radius:8px;
  background:var(--surface);
  color:var(--sub);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  padding:6px 3px;
}
.zone-chip.active{
  border-color:var(--accent);
  background:#dcecff;
  color:var(--text);
  box-shadow:0 0 0 3px var(--focus);
}
.zone-chip.done{
  background:#e6f7eb;
  border-color:var(--green);
  color:var(--text);
}
.zone-chip-name{
  font-size:.72rem;
  font-weight:900;
  letter-spacing:.03em;
  white-space:nowrap;
}
.zone-chip-value{
  font-size:.82rem;
  font-weight:900;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.input-card{
  margin-top:18px;
}
.mode-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  padding:12px 12px 0;
}
.mode-btn{
  min-height:46px;
  border:2px solid var(--border);
  border-radius:9px;
  background:var(--surface);
  color:var(--text);
  font-weight:950;
}
.mode-btn.active{
  border-color:var(--amber);
  background:#fff0d4;
  color:#442400;
}
.mode-btn:disabled{
  background:#dce2e8;
  color:#4c5866;
}
.keypad{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  padding:12px;
}
.key{
  min-height:58px;
  border:2px solid var(--border);
  border-radius:10px;
  background:var(--key-bg);
  color:var(--key-ink);
  font-family:var(--calc);
  font-size:1.75rem;
  font-weight:950;
  box-shadow:0 3px 0 var(--border);
}
.key:active,.fn-btn:active,.bottom-btn:active,.mode-btn:active,.mini-btn:active,.zone-chip:active,.history-load:active{transform:scale(.98)}
@keyframes pressPulse{
  0%{transform:scale(1);filter:brightness(1)}
  42%{transform:scale(.94);filter:brightness(.9)}
  100%{transform:scale(1);filter:brightness(1)}
}
button.press-flash{
  animation:pressPulse .18s ease-out;
}
.key:focus-visible,
.fn-btn:focus-visible,
.bottom-btn:focus-visible,
.mode-btn:focus-visible,
.mini-btn:focus-visible,
.zone-chip:focus-visible,
.history-load:focus-visible{
  outline:4px solid var(--focus);
  outline-offset:2px;
}
.fn-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:6px;
  padding:8px 12px 0;
}
.fn-btn{
  min-height:40px;
  border:2px solid var(--border);
  border-radius:9px;
  background:var(--surface2);
  color:var(--text);
  font-size:.76rem;
  font-weight:900;
  line-height:1.15;
  padding:4px 2px;
}
.fn-btn.warning{color:#5a0c07;background:#ffe5e1;border-color:var(--red)}
.fn-btn.accent{color:#062a5f;background:#dcecff;border-color:var(--accent)}
.value-display{
  margin:8px 12px 0;
  min-height:50px;
  border:2px solid var(--border);
  border-radius:10px;
  background:#07111f;
  color:#ffffff;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  padding:6px 14px;
  font-family:var(--calc);
  font-size:2rem;
  font-weight:950;
  letter-spacing:.04em;
  line-height:1;
  overflow:hidden;
  white-space:nowrap;
}
.key.action-key{
  font-family:var(--sans);
  font-size:1rem;
  letter-spacing:.02em;
}
.key.full-key,
.key.empty-key{
  background:var(--key-bg);
  color:var(--key-ink);
  border-color:var(--border);
}
.tower{
  padding:12px 13px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.tower-title{
  color:var(--sub);
  font-size:.8rem;
  font-weight:900;
}
.tower-num{
  font-size:1.3rem;
  font-weight:950;
}
.preview{
  white-space:pre-wrap;
  line-height:1.72;
  padding:13px;
  margin:0;
  font-size:.92rem;
  background:#e6f7eb;
  border-left:4px solid var(--green);
}
.history-list{
  max-height:190px;
  overflow:auto;
  padding:4px 8px 8px;
}
.history-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  border-bottom:1px solid #708090;
  padding:10px 4px;
}
.history-time{
  color:var(--accent);
  font-family:var(--mono);
  font-size:.72rem;
  font-weight:900;
}
.history-preview{
  margin-top:3px;
  color:var(--text);
  font-family:var(--mono);
  font-size:.76rem;
  max-width:230px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.history-load{
  min-height:38px;
  border:2px solid var(--accent);
  border-radius:8px;
  background:#dcecff;
  color:#062a5f;
  font-weight:900;
  padding:7px 11px;
}
.empty{
  color:var(--sub);
  text-align:center;
  padding:18px 0;
  font-size:.82rem;
}
.bottom-bar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:20;
  background:var(--surface);
  border-top:3px solid var(--border);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
}
.bottom-inner{
  max-width:440px;
  margin:0 auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.bottom-btn{
  min-height:52px;
  border:2px solid var(--border);
  border-radius:10px;
  font-weight:950;
  letter-spacing:.04em;
}
.share{grid-column:1/-1;background:var(--green);color:#ffffff;font-size:1rem}
.copy{background:var(--accent);color:#ffffff}
.reset{background:var(--surface);color:var(--text);border:2px solid var(--border)}
.toast{
  position:fixed;
  left:50%;
  bottom:124px;
  z-index:30;
  transform:translateX(-50%) translateY(18px);
  opacity:0;
  pointer-events:none;
  background:#07111f;
  color:#ffffff;
  border-radius:999px;
  padding:10px 14px;
  font-size:.86rem;
  font-weight:900;
  box-shadow:var(--shadow);
  transition:opacity .16s ease,transform .16s ease;
  white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:441px){
  body{background:#dfe8f1}
}
@media(prefers-contrast:more){
  :root{
    --bg:#ffffff;
    --surface:#ffffff;
    --surface2:#f2f2f2;
    --surface3:#e7e7e7;
    --border:#000000;
    --text:#000000;
    --sub:#000000;
    --accent:#0047a8;
    --green:#006b27;
    --amber:#7a3f00;
    --red:#990b00;
    --focus:#ffd400;
    --key-bg:#ffffff;
    --key-ink:#000000;
  }
  .card,.zone-chip,.mode-btn,.key,.fn-btn,.bottom-btn,.mini-btn{border-width:3px}
}
@media(prefers-reduced-motion:reduce){
  button.press-flash{animation:none}
  .key:active,.fn-btn:active,.bottom-btn:active,.mode-btn:active,.mini-btn:active,.zone-chip:active,.history-load:active{transform:none}
}
@media(max-height:880px) and (max-width:440px){
  .app{
    min-height:100dvh;
    padding:8px 10px 60px;
  }
  .topbar{
    margin:-8px -10px 8px;
    padding:8px 10px;
  }
  .title{font-size:.86rem}
  .timebox{gap:6px}
  .clock{font-size:.92rem}
  .mini-btn{
    min-height:28px;
    padding:4px 8px;
    font-size:.66rem;
    border-radius:6px;
  }
  .progress{
    margin-top:6px;
    gap:6px;
  }
  .progress-label{
    min-width:34px;
    font-size:.68rem;
  }
  .progress-track{height:5px}
  .sync-row{margin-top:5px;gap:6px}
  .sync-chip{min-height:18px;font-size:.56rem;padding:1px 8px}
  .card{
    margin-bottom:8px;
    border-radius:8px;
    box-shadow:none;
  }
  .card-head{
    padding:7px 10px;
  }
  .label{font-size:.64rem}
  .zones{
    gap:4px;
    padding:8px;
  }
  .zone-chip{
    min-height:44px;
    border-radius:6px;
    gap:1px;
    padding:4px 2px;
  }
  .zone-chip-name{font-size:.62rem}
  .zone-chip-value{font-size:.66rem}
  .input-card{
    margin-top:10px;
  }
  .mode-row{
    gap:6px;
    padding:8px 10px 0;
  }
  .mode-btn{
    min-height:36px;
    border-radius:7px;
    font-size:.8rem;
  }
  .fn-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;padding:6px 10px 0}
  .fn-btn{
    min-height:32px;
    border-radius:7px;
    font-size:.58rem;
    line-height:1.1;
    padding:3px 1px;
  }
  .value-display{
    min-height:38px;
    margin:6px 10px 0;
    border-radius:8px;
    padding:5px 10px;
    font-size:1.55rem;
  }
  .keypad{
    gap:6px;
    padding:6px 10px 8px;
  }
  .key{
    min-height:42px;
    border-radius:8px;
    font-size:1.55rem;
  }
  .key.action-key{
    font-size:.76rem;
    line-height:1.15;
  }
  .bottom-bar{
    padding:6px 10px calc(6px + env(safe-area-inset-bottom));
  }
  .bottom-inner{
    grid-template-columns:1fr 1fr 1fr;
    gap:6px;
  }
  .bottom-btn{
    min-height:40px;
    border-radius:8px;
    font-size:.7rem;
    letter-spacing:0;
    padding:4px 2px;
  }
  .share{grid-column:auto;font-size:.75rem}
  .toast{bottom:58px}
  .secondary-card{display:none}
}
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="topline">
      <div class="title">保全停車回報</div>
      <div class="timebox">
        <span class="clock" id="clockDisplay">--:--</span>
        <button class="mini-btn" id="refreshBtn">更新</button>
      </div>
    </div>
    <div class="progress">
      <span class="progress-label" id="progressLabel">1/10</span>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="sync-row">
      <span class="sync-chip" id="syncStatus">初始化…</span>
    </div>
  </header>

  <section class="card order-card">
    <div class="card-head"><span class="label">填寫順序</span></div>
    <div class="zones" id="zoneList"></div>
  </section>

  <section class="card input-card">
    <div class="card-head"><span class="label">頁面數字鍵盤</span></div>
    <div class="mode-row">
      <button class="mode-btn active" id="normalModeBtn">成數/車位</button>
      <button class="mode-btn" id="cartModeBtn">台車模式</button>
      <button class="mode-btn" id="guidingBtn">引導中</button>
    </div>
    <div class="fn-grid">
      <button class="fn-btn warning" id="clearCellBtn">清除本格</button>
      <button class="fn-btn" id="prevBtn">上一格</button>
      <button class="fn-btn accent" id="nextBtn">下一格</button>
      <button class="fn-btn" id="deleteDigitBtn">刪除</button>
    </div>
    <div class="value-display" aria-live="polite">
      <span id="currentInputValue">—</span>
    </div>
    <div class="keypad" id="keypad"></div>
  </section>

  <section class="card secondary-card">
    <div class="tower">
      <div class="tower-title">車塔停放使用率</div>
      <div class="tower-num" id="towerUsage">—</div>
    </div>
  </section>

  <section class="card secondary-card">
    <div class="card-head"><span class="label">LINE 回報預覽</span></div>
    <pre class="preview" id="linePreview"></pre>
  </section>

  <section class="card secondary-card">
    <div class="card-head"><span class="label">保全回報歷史</span></div>
    <div class="history-list" id="historyList"></div>
  </section>
</main>

<div class="bottom-bar">
  <div class="bottom-inner">
    <button class="bottom-btn share" id="shareLineBtn">分享到 LINE</button>
    <button class="bottom-btn copy" id="copyLineBtn">複製 LINE 回報</button>
    <button class="bottom-btn reset" id="resetBtn">清除重填</button>
  </div>
</div>
<div class="toast" id="toast">已複製</div>

<script type="module">
import { normalizeInput, formatValue, buildReport, buildTowerUsage, formatTime } from './js/parking-core.js';

const FALLBACK_ZONES = [
  { code: 'floor_above', label: '車塔1上', position: 0, unit: 'spaces', inTower: true },
  { code: 'floor_below', label: '車塔1下', position: 1, unit: 'spaces', inTower: true },
  { code: 'p1',          label: 'P1',      position: 2, unit: 'tenths', inTower: false },
  { code: 'p3',          label: 'P3',      position: 3, unit: 'tenths', inTower: false },
  { code: 'spin_a',      label: 'A區',     position: 4, unit: 'tenths', inTower: false },
  { code: 'spin_b',      label: 'B區',     position: 5, unit: 'tenths', inTower: false },
  { code: 'spin_c',      label: 'C區',     position: 6, unit: 'tenths', inTower: false },
  { code: 'spin_d',      label: 'D區',     position: 7, unit: 'tenths', inTower: false },
  { code: 'spin_e',      label: 'E區',     position: 8, unit: 'tenths', inTower: false },
  { code: 'asphalt',     label: '柏油路',   position: 9, unit: 'tenths', inTower: false },
];
const ZONES_CACHE_KEY = 'parking_guard_zones_v1';
const TOWER_TOTAL_CACHE_KEY = 'parking_guard_tower_total_v1';

function loadCachedZones() {
  try {
    const cached = JSON.parse(localStorage.getItem(ZONES_CACHE_KEY) || 'null');
    if (Array.isArray(cached) && cached.length) return cached;
  } catch {}
  return FALLBACK_ZONES;
}

let zones = loadCachedZones();
let towerTotal = Number(localStorage.getItem(TOWER_TOTAL_CACHE_KEY)) || 1600;

const HISTORY_STORAGE_KEY = 'parking_guard_history_v1';
const OUTBOX_STORAGE_KEY = 'parking_guard_outbox_v1';
const DEVICE_KEY_STORAGE = 'parking_guard_device_key_v1';
const MAX_HISTORY = 30;
const AUTO_ADVANCE_CAR_DIGITS = 3;
const AUTO_ADVANCE_DELAY_MS = 650;
const SYNC_RETRY_MS = 30000;
const DEDUPE_WINDOW_MS = 3000;

let currentTime = new Date();
let currentIndex = 0;
let entryMode = 'normal';
let cells = zones.map(() => ({ kind: 'none' }));
let draft = '';
let historyEntries = [];
let autoAdvanceTimer = null;
let outbox = [];
let syncing = false;
let lastSyncedAt = null;
let syncError = null;

const $ = (id) => document.getElementById(id);
const clockDisplay = $('clockDisplay');
const refreshBtn = $('refreshBtn');
const progressLabel = $('progressLabel');
const progressFill = $('progressFill');
const zoneList = $('zoneList');
const keypad = $('keypad');
const normalModeBtn = $('normalModeBtn');
const cartModeBtn = $('cartModeBtn');
const guidingBtn = $('guidingBtn');
const clearCellBtn = $('clearCellBtn');
const prevBtn = $('prevBtn');
const nextBtn = $('nextBtn');
const deleteDigitBtn = $('deleteDigitBtn');
const currentInputValue = $('currentInputValue');
const towerUsage = $('towerUsage');
const linePreview = $('linePreview');
const historyList = $('historyList');
const shareLineBtn = $('shareLineBtn');
const copyLineBtn = $('copyLineBtn');
const resetBtn = $('resetBtn');
const toast = $('toast');
const syncStatus = $('syncStatus');

function formatClock(date) {
  return formatTime(date);
}

function formatHistoryTimeLabel(date) {
  return new Intl.DateTimeFormat('zh-TW', {
    timeZone: 'Asia/Taipei',
    month: 'numeric',
    day: 'numeric',
    hour: '2-digit',
    minute: '2-digit',
    hourCycle: 'h23',
  }).format(date);
}

function showToast(message) {
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.remove('show'), 1800);
}

function flashButton(button) {
  if (!button) return;
  button.classList.remove('press-flash');
  void button.offsetWidth;
  button.classList.add('press-flash');
  clearTimeout(button.pressFlashTimer);
  button.pressFlashTimer = setTimeout(() => button.classList.remove('press-flash'), 220);
}

function cancelAutoAdvance() {
  clearTimeout(autoAdvanceTimer);
  autoAdvanceTimer = null;
}

function currentZone() {
  return zones[currentIndex];
}

function commitDraft() {
  cells[currentIndex] = draft ? normalizeInput(draft, currentZone()) : { kind: 'none' };
}

function scheduleAutoAdvance(index, snapshot) {
  cancelAutoAdvance();
  autoAdvanceTimer = setTimeout(() => {
    autoAdvanceTimer = null;
    if (currentIndex === index && draft === snapshot) moveNext();
  }, AUTO_ADVANCE_DELAY_MS);
}

function moveTo(index) {
  cancelAutoAdvance();
  currentIndex = Math.max(0, Math.min(zones.length - 1, index));
  entryMode = 'normal';
  draft = '';
  render();
}

function moveNext() {
  moveTo(currentIndex + 1);
}

function movePrev() {
  moveTo(currentIndex - 1);
}

function inputDigit(digit) {
  cancelAutoAdvance();
  const zone = currentZone();

  if (entryMode === 'cart') {
    cells[currentIndex] = digit === '0' ? { kind: 'full' } : { kind: 'carts', value: Number(digit) };
    moveNext();
    return;
  }

  if (zone.unit === 'spaces') {
    draft = `${draft}${digit}`.replace(/^0+(?=\d)/, '');
    commitDraft();
    if (draft.length >= AUTO_ADVANCE_CAR_DIGITS) {
      render();
      scheduleAutoAdvance(currentIndex, draft);
      return;
    }
    render();
    return;
  }

  cells[currentIndex] = digit === '0' ? { kind: 'full' } : { kind: 'tenths', value: Number(digit) };
  moveNext();
}

function clearCurrent() {
  cancelAutoAdvance();
  draft = '';
  cells[currentIndex] = { kind: 'none' };
  render();
}

function deleteDigit() {
  cancelAutoAdvance();
  if (!draft && cells[currentIndex].kind === 'none' && currentIndex > 0) {
    currentIndex -= 1;
    entryMode = 'normal';
    draft = '';
  }
  if (draft.length > 1) {
    draft = draft.slice(0, -1);
    commitDraft();
    render();
    return;
  }
  draft = '';
  cells[currentIndex] = { kind: 'none' };
  render();
}

function markFull() {
  draft = '';
  cells[currentIndex] = { kind: 'full' };
  moveNext();
}

function markEmpty() {
  draft = '';
  cells[currentIndex] = { kind: 'none' };
  moveNext();
}

function markGuiding() {
  draft = '';
  cells[currentIndex] = { kind: 'guiding' };
  moveNext();
}

function resetAll() {
  if (!confirm('確定要清除目前回報並重新輸入嗎？')) return;
  cells = zones.map(() => ({ kind: 'none' }));
  currentTime = new Date();
  moveTo(0);
}

function setMode(mode) {
  cancelAutoAdvance();
  entryMode = mode;
  render();
}

function renderKeypad() {
  keypad.innerHTML = '';
  const keypadItems = [
    { text:'1', aria:'輸入 1', className:'key', action:() => inputDigit('1') },
    { text:'2', aria:'輸入 2', className:'key', action:() => inputDigit('2') },
    { text:'3', aria:'輸入 3', className:'key', action:() => inputDigit('3') },
    { text:'4', aria:'輸入 4', className:'key', action:() => inputDigit('4') },
    { text:'5', aria:'輸入 5', className:'key', action:() => inputDigit('5') },
    { text:'6', aria:'輸入 6', className:'key', action:() => inputDigit('6') },
    { text:'7', aria:'輸入 7', className:'key', action:() => inputDigit('7') },
    { text:'8', aria:'輸入 8', className:'key', action:() => inputDigit('8') },
    { text:'9', aria:'輸入 9', className:'key', action:() => inputDigit('9') },
    { text:'全滿', aria:'標記全滿', className:'key action-key full-key', action:markFull },
    { text:'0', aria:'輸入 0', className:'key', action:() => inputDigit('0') },
    { text:'未停車', aria:'標記未停車', className:'key action-key empty-key', action:markEmpty },
  ];
  keypadItems.forEach((item) => {
    const button = document.createElement('button');
    button.className = item.className;
    button.type = 'button';
    button.textContent = item.text;
    button.setAttribute('aria-label', item.aria);
    button.addEventListener('click', item.action);
    keypad.appendChild(button);
  });
}

function renderZones() {
  zoneList.innerHTML = '';
  zones.forEach((zone, index) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = `zone-chip ${index === currentIndex ? 'active' : ''} ${cells[index].kind !== 'none' ? 'done' : ''}`;
    button.innerHTML = `<span class="zone-chip-name">${zone.label}</span><span class="zone-chip-value">${formatValue(cells[index])}</span>`;
    button.addEventListener('click', () => moveTo(index));
    zoneList.appendChild(button);
  });
}

function renderHistory() {
  if (!historyEntries.length) {
    historyList.innerHTML = '<div class="empty">尚無保全回報歷史</div>';
    return;
  }
  historyList.innerHTML = historyEntries.slice().reverse().map((entry) => `
    <div class="history-item">
      <div>
        <div class="history-time">${entry.timeLabel}</div>
        <div class="history-preview">${entry.preview}</div>
      </div>
      <button class="history-load" data-id="${entry.id}">載入</button>
    </div>
  `).join('');
  historyList.querySelectorAll('.history-load').forEach((button) => {
    button.addEventListener('click', () => {
      const entry = historyEntries.find((item) => item.id === button.dataset.id);
      if (!entry) return;
      cells = zones.map((zone) => entry.values?.[zone.code] ?? { kind: 'none' });
      draft = '';
      currentTime = new Date(entry.timestamp);
      moveTo(0);
    });
  });
}

function render() {
  const values = valuesObject();
  const tower = buildTowerUsage(values, zones, { towerTotal });
  const completed = cells.filter((cell) => cell.kind !== 'none').length;
  const isSpacesZone = currentZone().unit === 'spaces';

  clockDisplay.textContent = formatClock(currentTime);
  progressLabel.textContent = `${currentIndex + 1}/${zones.length}`;
  progressFill.style.width = `${((currentIndex + 1) / zones.length) * 100}%`;
  normalModeBtn.classList.toggle('active', entryMode === 'normal');
  cartModeBtn.classList.toggle('active', entryMode === 'cart');
  cartModeBtn.disabled = isSpacesZone;
  cartModeBtn.textContent = isSpacesZone ? '台車模式不可用' : '台車模式';
  currentInputValue.textContent = cells[currentIndex].kind === 'none' ? '—' : formatValue(cells[currentIndex]);
  towerUsage.textContent = tower.valid ? `${tower.percent}%` : '—';
  towerUsage.style.color = !tower.valid ? 'var(--sub)' : tower.percent >= 90 ? 'var(--red)' : tower.percent >= 70 ? 'var(--amber)' : 'var(--green)';
  linePreview.textContent = buildReport(values, zones, { style: 'guard', time: currentTime });
  document.title = `保全停車回報 ${completed}/${zones.length}`;
  renderZones();
}

function valuesObject() {
  const out = {};
  zones.forEach((zone, index) => {
    out[zone.code] = cells[index];
  });
  return out;
}

async function refreshZones() {
  try {
    const response = await fetch('/api/zones');
    if (!response.ok) return;
    const data = await response.json();
    if (!Array.isArray(data.zones) || !data.zones.length) return;
    const changed = JSON.stringify(data.zones) !== JSON.stringify(zones);
    localStorage.setItem(ZONES_CACHE_KEY, JSON.stringify(data.zones));
    zones = data.zones;
    if (changed) {
      cells = zones.map(() => ({ kind: 'none' }));
      moveTo(0);
      showToast('區域設定已更新');
    }
  } catch {}
}

function getDeviceKey() {
  return localStorage.getItem(DEVICE_KEY_STORAGE) || '';
}

function setupDeviceKeyFromHash() {
  const match = location.hash.match(/^#key=([A-Za-z0-9_-]+)$/);
  if (!match) return false;
  localStorage.setItem(DEVICE_KEY_STORAGE, match[1]);
  history.replaceState(null, '', location.pathname + location.search);
  return true;
}

function loadOutbox() {
  try {
    const stored = JSON.parse(localStorage.getItem(OUTBOX_STORAGE_KEY) || '[]');
    outbox = Array.isArray(stored) ? stored : [];
  } catch {
    outbox = [];
  }
}

function saveOutbox() {
  localStorage.setItem(OUTBOX_STORAGE_KEY, JSON.stringify(outbox.slice(-50)));
}

function renderSync() {
  const hasKey = !!getDeviceKey();
  syncStatus.className = 'sync-chip';
  if (syncError === 'unauthorized') {
    syncStatus.classList.add('bad');
    syncStatus.textContent = '裝置未授權，請聯絡中控';
  } else if (syncing) {
    syncStatus.classList.add('warn');
    syncStatus.textContent = '同步中…';
  } else if (outbox.length) {
    syncStatus.classList.add(hasKey ? 'warn' : 'bad');
    syncStatus.textContent = hasKey ? `待同步 ${outbox.length}` : '未綁定裝置，僅存本機';
  } else if (lastSyncedAt) {
    syncStatus.classList.add('good');
    syncStatus.textContent = `已同步 ${formatClock(lastSyncedAt)}`;
  } else {
    syncStatus.textContent = '已連線';
  }
}

async function flushOutbox() {
  if (syncing) return;
  const hasKey = !!getDeviceKey();
  if (!hasKey || !outbox.length) {
    renderSync();
    return;
  }
  syncing = true;
  syncError = null;
  renderSync();
  try {
    while (outbox.length) {
      const item = outbox[0];
      let response;
      try {
        response = await fetch('/api/reports', {
          method: 'POST',
          headers: {
            'content-type': 'application/json',
            'authorization': `Bearer ${getDeviceKey()}`,
          },
          body: JSON.stringify({
            client_request_id: item.clientRequestId,
            values: item.values,
            raw_input: item.preview,
            client_submitted_at: item.submittedAt,
          }),
        });
      } catch {
        throw new Error('network');
      }
      if (response.status === 401 || response.status === 403) {
        syncError = 'unauthorized';
        break;
      }
      if (response.ok || response.status === 400 || response.status === 422) {
        outbox.shift();
        saveOutbox();
        lastSyncedAt = new Date();
      } else {
        throw new Error('server');
      }
    }
  } catch {
    syncError = null;
  }
  syncing = false;
  renderSync();
}

function enqueueSubmit(entry) {
  outbox.push({
    clientRequestId: entry.id,
    values: entry.values,
    rawInput: entry.preview,
    submittedAt: new Date(entry.timestamp).toISOString(),
    preview: entry.preview,
  });
  saveOutbox();
  flushOutbox();
}

function loadHistory() {
  try {
    const stored = JSON.parse(localStorage.getItem(HISTORY_STORAGE_KEY) || '[]');
    historyEntries = Array.isArray(stored) ? stored : [];
  } catch {
    historyEntries = [];
  }
}

function saveHistory() {
  localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(historyEntries.slice(-MAX_HISTORY)));
}

function addHistory() {
  const now = Date.now();
  if (addHistory.lastAt && now - addHistory.lastAt < DEDUPE_WINDOW_MS) return;
  addHistory.lastAt = now;

  const id = `${now}-${Math.random().toString(36).slice(2, 8)}`;
  const values = valuesObject();
  const timeLabel = formatHistoryTimeLabel(currentTime);
  const preview = zones.map((zone, index) => `${zone.label}${formatValue(cells[index])}`).join(' ');
  historyEntries.push({ id, timestamp: currentTime.getTime(), timeLabel, values, preview });
  historyEntries = historyEntries.slice(-MAX_HISTORY);
  saveHistory();
  renderHistory();
  enqueueSubmit(historyEntries[historyEntries.length - 1]);
}

async function copyReport(message) {
  const text = message || buildReport(valuesObject(), zones, { style: 'guard', time: currentTime });
  try {
    await navigator.clipboard.writeText(text);
    addHistory();
    showToast('已複製 LINE 回報');
    return true;
  } catch {
    if (fallbackCopyText(text)) {
      addHistory();
      showToast('已複製 LINE 回報');
      return true;
    }
    showToast('複製失敗，請手動選取預覽文字');
    return false;
  }
}

function fallbackCopyText(text) {
  const area = document.createElement('textarea');
  area.value = text;
  area.setAttribute('readonly', '');
  area.style.position = 'fixed';
  area.style.left = '-9999px';
  area.style.top = '0';
  document.body.appendChild(area);
  area.focus();
  area.select();
  let ok = false;
  try {
    ok = document.execCommand('copy');
  } catch {
    ok = false;
  }
  document.body.removeChild(area);
  return ok;
}

async function shareToLine() {
  const text = buildReport(valuesObject(), zones, { style: 'guard', time: currentTime });
  await copyReport(text);
  const lineUrl = `https://line.me/R/share?text=${encodeURIComponent(text)}`;
  try {
    window.location.href = lineUrl;
  } catch {
    showToast('已改為複製，請貼到 LINE 群組');
  }
}

refreshBtn.addEventListener('click', () => {
  currentTime = new Date();
  render();
  showToast('時間已更新');
});
normalModeBtn.addEventListener('click', () => setMode('normal'));
cartModeBtn.addEventListener('click', () => {
  if (currentZone().unit !== 'spaces') setMode('cart');
});
guidingBtn.addEventListener('click', markGuiding);
clearCellBtn.addEventListener('click', clearCurrent);
prevBtn.addEventListener('click', movePrev);
nextBtn.addEventListener('click', moveNext);
deleteDigitBtn.addEventListener('click', deleteDigit);
shareLineBtn.addEventListener('click', shareToLine);
copyLineBtn.addEventListener('click', () => copyReport());
resetBtn.addEventListener('click', resetAll);
document.addEventListener('pointerdown', (event) => {
  const button = event.target.closest('button');
  if (!button) return;
  flashButton(button);
});
window.addEventListener('online', flushOutbox);
window.addEventListener('online', refreshZones);
window.addEventListener('load', flushOutbox);
setInterval(flushOutbox, SYNC_RETRY_MS);

if (setupDeviceKeyFromHash()) {
  showToast('裝置綁定完成');
}
loadOutbox();
renderKeypad();
loadHistory();
renderHistory();
render();
renderSync();
flushOutbox();
refreshZones();
</script>
</body>
</html>
